name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gowthamsai09/Axon
          path: hub
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Generated prompt module matches prompts/summarizer_system.txt
        run: npm run prompt:check
      - name: Prompt equals the hub's canonical copy
        run: npm run prompt:hub -- hub
      - name: Tests (includes zod <-> hub JSON Schema contract test)
        env:
          HUB_SCHEMAS_DIR: ${{ github.workspace }}/hub/schemas
          REQUIRE_HUB_SCHEMAS: "1"
          HUB_CORPUS_DIR: ${{ github.workspace }}/hub/corpus/injection
          REQUIRE_HUB_CORPUS: "1"
          HUB_DIR: ${{ github.workspace }}/hub
          REQUIRE_HUB_PROMPTS: "1"
        run: npm test
      - name: The Worker bundles (no Cloudflare credentials, nothing is deployed)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run
