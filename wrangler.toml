# Spec 7.2, updated in Phase 3 (Appendix C 45 to 56). Nothing here is deployed yet.
name = "axon-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-01"   # verified against the installed workerd (see STATE)

[vars]
FEED_BASE = "https://gowthamsai09.github.io/axon-feed/feed"   # Pages is enabled in Phase 1
PUBLIC_URL = "https://axon-gateway.gowthamsaiyadlapalli1234.workers.dev"      # set after the first deploy; local: --var PUBLIC_URL:http://localhost:8787
ALLOWED_PROVIDERS = "deepseek,huggingface"
HF_DEFAULT_MODEL = "openai/gpt-oss-120b"
# Tier 3 (Phase 4): the surface appears only when TOKENS, GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY all exist.
# A placeholder id keeps Tier 3 off. Set the real values at the first push (docs/github-app-setup.md).
GITHUB_APP_ID = "5953758"
# Never set ENVIRONMENT or the GITHUB_* override variables here: they exist only in .dev.vars for local mock runs.

[[kv_namespaces]]
binding = "TOKENS"
id = "5136d3ed7d074e1c81e670f4cedfbfe7"   # wrangler kv namespace create TOKENS

# Workers Rate Limiting binding, current syntax (Appendix B item 4, verified 2026-10-25).
# `period` may only be 10 or 60. Counters are per Cloudflare location and approximate.
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_SUMMARY"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_TIER3"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 30
  period = 60

# Do not enable request/header logging for this Worker (Tier 2 headers contain caller keys).
[observability]
enabled = false

# Secret (never in this file): wrangler secret put GITHUB_APP_PRIVATE_KEY   (the .pem exactly as GitHub downloads it)
